name: Build KORG RE LAB macOS Intel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'KORG-RE-LAB-source.zip'
      - '.github/workflows/build-korg-re-lab-macos-intel.yml'
  pull_request:
    branches: [main]
    paths:
      - 'KORG-RE-LAB-source.zip'
      - '.github/workflows/build-korg-re-lab-macos-intel.yml'

concurrency:
  group: korg-re-lab-macos-intel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand source
        shell: bash
        run: |
          set -euo pipefail
          ZIP='KORG-RE-LAB-source.zip'
          test -f "$ZIP" || { echo 'KORG RE LAB source ZIP not found'; exit 1; }
          rm -rf korg-re-lab-src
          mkdir -p korg-re-lab-src
          ditto -x -k "$ZIP" korg-re-lab-src
          CMAKE_FILE=$(find korg-re-lab-src -maxdepth 4 -name CMakeLists.txt -print -quit)
          test -n "$CMAKE_FILE" || { echo 'CMakeLists.txt not found in source ZIP'; exit 1; }
          ROOT=$(dirname "$CMAKE_FILE")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Configure Intel macOS 10.13
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$PROJECT_ROOT" -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DBUILD_TESTING=ON

      - name: Build KORG RE LAB app
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel 4

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -C Release --output-on-failure | tee test-results.txt

      - name: Locate macOS app
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build -type d -name 'KORG RE LAB.app' -print -quit)
          test -n "$APP" || { echo 'KORG RE LAB.app not found'; find build -maxdepth 4 -print; exit 1; }

          BIN="$APP/Contents/MacOS/KORG RE LAB"
          test -x "$BIN" || { echo "App executable not found: $BIN"; find "$APP" -maxdepth 4 -print; exit 1; }

          PLIST="$APP/Contents/Info.plist"
          test -f "$PLIST" || { echo "Info.plist not found"; exit 1; }
          plutil -lint "$PLIST"

          echo "KORG_RE_LAB_APP=$APP" >> "$GITHUB_ENV"
          echo "KORG_RE_LAB_BIN=$BIN" >> "$GITHUB_ENV"
          echo "App: $APP"
          echo "Executable: $BIN"

      - name: Verify Intel and macOS 10.13 target
        shell: bash
        run: |
          set -euo pipefail
          file "$KORG_RE_LAB_BIN" | tee binary-info.txt
          file "$KORG_RE_LAB_BIN" | grep -q 'x86_64' || { echo 'ERROR: binary is not x86_64'; exit 1; }

          VTOOL_OUTPUT=$(xcrun vtool -show-build "$KORG_RE_LAB_BIN")
          printf '%s\n' "$VTOOL_OUTPUT" | tee deployment-info.txt

          MINOS=$(printf '%s\n' "$VTOOL_OUTPUT" | awk '
            $1 == "minos" { print $2; exit }
            /LC_VERSION_MIN_MACOSX/ { legacy=1; next }
            legacy && $1 == "version" { print $2; exit }
          ')
          test -n "$MINOS" || { echo 'Could not determine deployment target'; exit 1; }

          awk -v v="$MINOS" 'BEGIN {
            split(v, a, "."); major=a[1]+0; minor=a[2]+0;
            if (major > 10 || (major == 10 && minor > 13)) exit 1;
          }' || { echo "ERROR: deployment target $MINOS is newer than macOS 10.13"; exit 1; }

      - name: Validate app bundle
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$KORG_RE_LAB_APP/Contents/Info.plist" | tee app-info.txt
          grep -qx 'KORG RE LAB' app-info.txt || { echo 'CFBundleExecutable does not match app binary'; exit 1; }

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$KORG_RE_LAB_APP/Contents/Info.plist" | tee -a app-info.txt

          codesign --force --deep --sign - "$KORG_RE_LAB_APP"
          codesign --verify --deep --strict "$KORG_RE_LAB_APP"

      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -f KORG-RE-LAB-macOS-Intel.zip

          ditto -c -k --sequesterRsrc --keepParent \
            "$KORG_RE_LAB_APP" \
            KORG-RE-LAB-macOS-Intel.zip

          test -s KORG-RE-LAB-macOS-Intel.zip || { echo 'Artifact ZIP was not created'; exit 1; }

      - name: Upload Intel macOS app
        uses: actions/upload-artifact@v4
        with:
          name: KORG-RE-LAB-macOS-Intel
          path: |
            KORG-RE-LAB-macOS-Intel.zip
            binary-info.txt
            deployment-info.txt
            test-results.txt
            app-info.txt
          if-no-files-found: error
          retention-days: 30
